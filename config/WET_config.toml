# XenonRecomp config for WET (Xbox 360, TitleID 425307DB, MediaID 666E3BB8, v3)
# Paths are relative to this file. Build the `recompile` target to run it.
[main]
file_path = "../game/extracted/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "WET_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (unique byte-pattern matches in .text; see tools/find_helpers.py)
restgprlr_14_address = 0x831BAC60
savegprlr_14_address = 0x831BAC10
restfpr_14_address   = 0x831BCD2C
savefpr_14_address   = 0x831BCCE0
restvmx_14_address   = 0x831BD018
savevmx_14_address   = 0x831BCD80
restvmx_64_address   = 0x831BD0AC
savevmx_64_address   = 0x831BCE14

# CRT setjmp/longjmp (18 and 20 call sites; matching jmp_buf layouts)
setjmp_address  = 0x831C2B50
longjmp_address = 0x831C2E20

# Leaf functions with no .pdata entry whose jump-table targets run past the
# analyzer's size estimate. Bounds = start .. next .pdata function (padding trimmed).
functions = [
    { address = 0x82EDB3E0, size = 0x240 },
    { address = 0x82EE8418, size = 0x154 },
    { address = 0x82EED770, size = 0x3F8 },
    { address = 0x82EEE578, size = 0x19C },
    { address = 0x82F08D98, size = 0x64 },
    { address = 0x82F14B50, size = 0x2B0 },
    { address = 0x831F7758, size = 0x1E8 },
    { address = 0x831FB950, size = 0xF4 },
    # Found via tools/find_jump_tables.py (switch targets beyond the analyzer's size guess).
    # Some overlap: small functions that branch into a shared tail; each gets its own copy.
    { address = 0x82849908, size = 0x1130 },
    { address = 0x82912E40, size = 0x6F0 },
    { address = 0x8297FB60, size = 0x60 },
    { address = 0x82CE9FE8, size = 0x8C },
    { address = 0x82D5F2A0, size = 0x1A8 },
    { address = 0x82D5F378, size = 0xD0 },
    { address = 0x82D97390, size = 0x188 },
    { address = 0x830C0B98, size = 0x114 },
    { address = 0x8310F180, size = 0x110 },
    { address = 0x8331E888, size = 0x434 },
    { address = 0x8331E8F0, size = 0x3CC },
    { address = 0x8331E958, size = 0x364 },
    { address = 0x8331E9B8, size = 0x304 },
    { address = 0x8331EB50, size = 0x16C },
    { address = 0x8322E068, size = 0x80 },
]

# 60 FPS option: the D3D present interval (vblanks per frame) as Present computes
# it - 2 for the game's 30 FPS. The runtime turns 2 into 1 when 60 FPS is on
# (same change as Xenia Canary's "60 FPS" game patch, 0x83066E67 = 1).
[[midasm_hook]]
name = "WetPresentIntervalHook"
address = 0x83066E70
registers = ["r11"]

# Graphics effect switches (wet.ini motion_blur / depth_of_field / camera_shake).
# The same changes as the community Xenia Canary game patch for WET (425307DB),
# applied after the original instruction (recompiled code never reads its own
# instruction bytes). Thanks to the xenia-canary/game-patches contributors and
# to nikolaygorb/WetRecomp, which ported them the same way.
# 0x82CB09B8 lfs f31,-8132(r9) -> lfs f31,10912(r9): motion blur strength.
[[midasm_hook]]
name = "WetMotionBlurHook"
address = 0x82CB09B8
registers = ["r9", "f31"]
after_instruction = true

# 0x82AE6A1C lbz r11,1688(r4) -> li r11,0: depth of field on/off.
[[midasm_hook]]
name = "WetDepthOfFieldHook"
address = 0x82AE6A1C
registers = ["r11"]
after_instruction = true

# 0x8274F58C stb r11,21(r3) -> stb r10,21(r3): camera shake.
[[midasm_hook]]
name = "WetCameraShakeHook"
address = 0x8274F58C
registers = ["r3", "r10"]
after_instruction = true

# 0x82751514 subfe r10,r10,r3 -> li r10,0 and 0x82751660 lbz r10,21(r11) ->
# li r10,0: the shaky film effect that goes with it.
[[midasm_hook]]
name = "WetFilmShakeHook"
address = 0x82751514
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
name = "WetFilmShakeHook"
address = 0x82751660
registers = ["r10"]
after_instruction = true
